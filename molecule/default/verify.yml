---
# code: language=ansible
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    ## パッケージのテスト
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto
    - name: Populate service facts
      ansible.builtin.service_facts:
    - name: Gather facts on listening ports
      community.general.listen_ports_facts:
        command: ss
    - name: Set assert variables
      ansible.builtin.set_fact:
        listen_tcp_posts: "{{ ansible_facts.tcp_listen | map(attribute='port') | unique | list }}"
        listen_udp_posts: "{{ ansible_facts.udp_listen | map(attribute='port') | unique | list }}"
    ## ユーザーのテスト
    - name: Get user facts
      ansible.builtin.getent:
        database: passwd
        key: meilisearch
    - name: Assert user
      ansible.builtin.assert:
        that: getent_passwd['meilisearch'] is defined
        fail_msg: "User meilisearch does not exist"
        success_msg: "User meilisearch exists"
    ## グループのテスト
    - name: Get group facts
      ansible.builtin.getent:
        database: group
        key: meilisearch
    - name: Assert group
      ansible.builtin.assert:
        that: getent_group['meilisearch'] is defined
        fail_msg: "Group meilisearch does not exist"
        success_msg: "Group meilisearch exists"
    # ファイルのテスト
    - name: Check meilisearch binary
      ansible.builtin.stat:
        path: /usr/local/bin/meilisearch
      register: binary_result
    - name: Assert file
      ansible.builtin.assert:
        that:
          - binary_result.stat.exists
          - binary_result.stat.executable
        fail_msg: "meilisearch binary is missing or not executable"
        success_msg: "meilisearch binary exists and is executable"
    ## サービスのテスト
    - name: Assert service
      ansible.builtin.assert:
        that:
          - ansible_facts.services['meilisearch.service'] is defined
          - ansible_facts.services['meilisearch.service']['state'] == 'running'
          - ansible_facts.services['meilisearch.service']['status'] == 'enabled'
        fail_msg: "meilisearch service is not running or enabled"
        success_msg: "meilisearch service is running and enabled"
    ## 待受ポートのテスト
    - name: Assert listen port
      ansible.builtin.assert:
        that:
          - 7700 in listen_tcp_posts
        fail_msg: "meilisearch port 7700 is not listening"
        success_msg: "meilisearch port 7700 is listening"
